<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f4">
    <title>{% if page.title and page.title != '首页' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Ivy 技术博客首页">
          <span class="brand-mark">I</span>
          <span>IVY / TECH NOTES</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/#articles' | relative_url }}">文章</a>
          <a href="https://github.com/Ivyzhang/covivy">项目</a>
          <a href="https://github.com/Ivyzhang">GitHub</a>
        </nav>
      </div>
    </header>

    {{ content }}

    <footer class="site-footer">
      <div class="shell footer-grid">
        <div>
          <p class="eyebrow">IVY / TECH NOTES</p>
          <p>写给愿意把问题追到根上的工程师。</p>
        </div>
        <div class="footer-links">
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="https://github.com/Ivyzhang">GitHub</a>
          <span>© {{ site.time | date: '%Y' }} Ivy Zhang</span>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
